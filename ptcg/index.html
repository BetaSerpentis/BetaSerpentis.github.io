<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝可梦卡牌库</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ptcg.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-orientations" content="portrait">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/ptcg/sw.js', { scope: '/ptcg/' })
        .then(function(registration) {
            console.log('ServiceWorker registered:', registration.scope);
        })
        .catch(function(error) {
            console.log('ServiceWorker failed:', error);
        });
    });
    }
    </script>
</head>
<body>
    <div id="three-container"></div>
    
    <div class="container">
        <div class="search-header">
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="搜索卡牌名字、效果...">
                <button class="search-button" id="search-button">搜索</button>
            </div>
        </div>
        
        <div class="content-wrapper">
            <div id="feature-content">
                <div class="feature-panel active" data-feature="browser">
                    <div class="feature-tabs" id="feature-tabs">
                        <div class="tabs-container" id="tabs-container">
                            <div class="tab active" data-tab="宝可梦">宝可梦</div>
                            <div class="tab" data-tab="支援者">支援者</div>
                            <div class="tab" data-tab="物品">物品</div>
                            <div class="tab" data-tab="宝可梦道具">宝可梦道具</div>
                            <div class="tab" data-tab="竞技场">竞技场</div>
                            <div class="tab" data-tab="基本能量">基本能量</div>
                            <div class="tab" data-tab="特殊能量">特殊能量</div>
                        </div>
                    </div>
                    
                    <div class="generation-tabs" id="generation-tabs" style="display: none;">
                        <div class="tabs-container" id="generation-tabs-container">
                            <div class="generation-tab active" data-generation="all">全部</div>
                            <div class="generation-tab" data-generation="1">第一世代</div>
                            <div class="generation-tab" data-generation="2">第二世代</div>
                            <div class="generation-tab" data-generation="3">第三世代</div>
                            <div class="generation-tab" data-generation="4">第四世代</div>
                            <div class="generation-tab" data-generation="5">第五世代</div>
                            <div class="generation-tab" data-generation="6">第六世代</div>
                            <div class="generation-tab" data-generation="7">第七世代</div>
                            <div class="generation-tab" data-generation="8">第八世代</div>
                            <div class="generation-tab" data-generation="9">第九世代</div>
                        </div>
                    </div>
                    
                    <div class="card-grid" id="card-grid"></div>
                    
                    <div class="no-results" id="no-results" style="display: none;">
                        没有找到匹配的卡牌，请尝试其他关键词
                    </div>
                </div>
                
                <div class="feature-panel" data-feature="deck">
                    <div class="coming-soon">
                        <h2>卡组编辑功能</h2>
                        <p>正在开发中，敬请期待...</p>
                    </div>
                </div>
                
                <div class="feature-panel" data-feature="battle">
                    <div class="coming-soon">
                        <h2>对战模拟功能</h2>
                        <p>正在开发中，敬请期待...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="modal" id="image-modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">
                <div class="modal-img-container" id="modal-img-container">
                    <img class="modal-img prev" id="modal-img-prev" src="" alt="宝可梦卡牌">
                    <img class="modal-img current" id="modal-img-current" src="" alt="宝可梦卡牌">
                    <img class="modal-img next" id="modal-img-next" src="" alt="宝可梦卡牌">
                </div>
                <div class="card-info">
                    <h2 class="card-name" id="card-name">皮卡丘</h2>
                </div>
            </div>
            <div class="nav-arrow arrow-left" id="prev-arrow">&#10094;</div>
            <div class="nav-arrow arrow-right" id="next-arrow">&#10095;</div>
        </div>
    </div>
    
    <footer>
        <p>宝可梦卡牌查看器 &copy; 2023 | 基于Three.js构建</p>
    </footer>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
