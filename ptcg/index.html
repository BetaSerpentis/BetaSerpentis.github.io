<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>宝可梦卡牌库</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ptcg.css">
    <link rel="stylesheet" href="css/battle-host.css">
    <link rel="stylesheet" href="battle/style.css">
    <link rel="manifest" href="manifest.json">
    <!-- 注意：这里刻意不声明 theme-color 与 
         apple-mobile-web-app-status-bar-style。
         black-translucent 会让 iOS 把状态栏（刘海）区域填成黑色，
         且 Safari 优先用 theme-color(#000000) 渲染浏览器 UI，
         导致页面背景无法透到刘海区（原 ptcgBattle 独立页没有这两个 meta，
         所以刘海正常显示场地色）。移除后 Safari 回退为「跟随页面背景」。 -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-orientations" content="portrait">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script>
    if ('serviceWorker' in navigator && !['localhost', '127.0.0.1'].includes(location.hostname)) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/ptcg/sw.js', { scope: '/ptcg/' })
        .then(function(registration) {
            console.log('ServiceWorker registered:', registration.scope);
        })
        .catch(function(error) {
            console.warn('ServiceWorker registration skipped:', error);
        });
    });
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="search-header">
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="搜索卡牌名字、效果...">
                <button class="search-button" id="search-button">搜索</button>
            </div>
        </div>
        
        <div class="content-wrapper">
            <div class="battle-entry">
                <button class="battle-entry-btn" id="open-battle-btn">⚔ 进入对战</button>
            </div>

            <div id="feature-content">
                <div class="feature-panel active" data-feature="browser">
                    <div class="feature-tabs" id="feature-tabs">
                        <div class="tabs-container" id="tabs-container">
                            <div class="tab active" data-tab="宝可梦">宝可梦</div>
                            <div class="tab" data-tab="支援者">支援者</div>
                            <div class="tab" data-tab="物品">物品</div>
                            <div class="tab" data-tab="宝可梦道具">宝可梦道具</div>
                            <div class="tab" data-tab="竞技场">竞技场</div>
                            <div class="tab" data-tab="基本能量">基本能量</div>
                            <div class="tab" data-tab="特殊能量">特殊能量</div>
                        </div>
                    </div>
                    
                    <div class="generation-tabs" id="generation-tabs" style="display: none;">
                        <div class="tabs-container" id="generation-tabs-container">
                            <div class="generation-tab active" data-generation="all">全部</div>
                            <div class="generation-tab" data-generation="1">第一世代</div>
                            <div class="generation-tab" data-generation="2">第二世代</div>
                            <div class="generation-tab" data-generation="3">第三世代</div>
                            <div class="generation-tab" data-generation="4">第四世代</div>
                            <div class="generation-tab" data-generation="5">第五世代</div>
                            <div class="generation-tab" data-generation="6">第六世代</div>
                            <div class="generation-tab" data-generation="7">第七世代</div>
                            <div class="generation-tab" data-generation="8">第八世代</div>
                            <div class="generation-tab" data-generation="9">第九世代</div>
                        </div>
                    </div>
                    
                    <div class="card-grid" id="card-grid"></div>
                    
                    <div class="no-results" id="no-results" style="display: none;">
                        没有找到匹配的卡牌，请尝试其他关键词
                    </div>
                </div>
                

            </div>
        </div>
        
        <div class="modal" id="image-modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div class="modal-content" id="modal-content">
                <div class="modal-img-container" id="modal-img-container">
                    <img class="modal-img prev" id="modal-img-prev" src="" alt="宝可梦卡牌">
                    <img class="modal-img current" id="modal-img-current" src="" alt="宝可梦卡牌">
                    <img class="modal-img next" id="modal-img-next" src="" alt="宝可梦卡牌">
                </div>
                <div class="card-info">
                    <h2 class="card-name" id="card-name">皮卡丘</h2>
                </div>
            </div>
            <div class="nav-arrow arrow-left" id="prev-arrow">&#10094;</div>
            <div class="nav-arrow arrow-right" id="next-arrow">&#10095;</div>
        </div>
    </div>
    
    <footer>
        <p>宝可梦卡牌查看器</p>
    </footer>

    <!-- ptcgBattle 战斗视图（嵌入式：切页只切换 #battle-app 的 .active，不重新加载页面） -->
    <div id="battle-app">
<div id="screen">
    <!-- ================= 战斗场景（单屏，pmBattle 布局） ================= -->
    <div id="battle-scene">
      <!-- 战斗日志（左上浮层） -->
      <div id="battle-log"></div>

      <!-- 对方信息（右上：名字 / 规则标记 / HP） -->
      <div class="info-box opponent-info" id="opponent-info">
        <div class="info-top">
          <span class="status-tag" id="opp-status" style="display:none"></span>
          <span class="info-name" id="opp-name">???</span>
          <span class="info-tags" id="opp-tags"></span>
        </div>
        <div class="hp-bar">
          <div class="hp-bar-fill" id="opp-hp-bar"></div>
          <span class="hp-text" id="opp-hp-text"></span>
        </div>
        <div class="energy-icons" id="opp-energy"></div>
        <div class="info-stats" id="opp-stats"></div>
      </div>

      <!-- 对方宝可梦立绘（血条正下方） -->
      <div class="sprite-slot opponent-sprite">
        <img class="platform" src="/ptcg/battle/assets/platform.png" alt="">
        <div class="sprite-img" id="opp-sprite"></div>
      </div>

      <!-- 我方宝可梦立绘（血条正上方） -->
      <div class="sprite-slot player-sprite">
        <img class="platform" src="/ptcg/battle/assets/platform.png" alt="">
        <div class="sprite-img large" id="player-sprite"></div>
      </div>

      <!-- 我方信息（左下） -->
      <div class="info-box player-info" id="player-info">
        <div class="info-top">
          <span class="status-tag" id="pl-status" style="display:none"></span>
          <span class="info-name" id="pl-name">???</span>
          <span class="info-tags" id="pl-tags"></span>
        </div>
        <div class="hp-bar">
          <div class="hp-bar-fill" id="pl-hp-bar"></div>
          <span class="hp-text" id="pl-hp-text"></span>
        </div>
        <div class="energy-icons" id="pl-energy"></div>
        <div class="info-stats" id="pl-stats"></div>
      </div>

      <!-- 隐藏字段（兼容遗留引用，不显示） -->
      <span id="phase-display" hidden></span>
      <span id="current-player-display" hidden></span>
    </div>

    <!-- ================= 操作区（右下浮动，pmBattle 单屏） ================= -->
    <div id="dialog-area">
      <div class="dialog-panel active" id="panel-main">
        <div class="dialog-text" id="main-text">加载中...</div>
        <div class="dialog-menu menu-list" id="main-menu">
          <div class="menu-item" data-action="fight">战 斗</div>
          <div class="menu-item" data-action="cards">卡 牌</div>
          <div class="menu-item" data-action="pokemon">场 地</div>
          <div class="menu-item" data-action="end">结 束</div>
          <div class="menu-item" data-action="mulligan" hidden>重新抽牌</div>
        </div>
      </div>

      <div class="dialog-panel" id="panel-fight">
        <div class="dialog-text" id="fight-text">选择招式！</div>
        <div class="dialog-menu menu-list" id="fight-menu"></div>
      </div>

      <div class="dialog-panel" id="panel-list">
        <div class="dialog-menu menu-list" id="list-menu"></div>
      </div>

      <div class="dialog-panel" id="panel-message">
        <div class="dialog-text full" id="msg-text"></div>
      </div>
    </div>

    <!-- ================= 卡组选择（换皮） ================= -->
    <div class="overlay-screen" id="screen-deck-select">
      <div class="overlay-header">
        <span class="page-title">选择卡组</span>
      </div>
      <div class="deck-select-body" id="deck-select-body"></div>
      <div class="overlay-footer">
        <span class="footer-btn" id="deck-back" hidden>← 返回卡牌库</span>
        <span class="footer-btn" id="deck-start">开始对战</span>
      </div>
    </div>
  </div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
