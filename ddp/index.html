<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：使用viewport-fit=cover适配刘海屏，但不要用100vh -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA 配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="宝可梦对对碰">
    
    <title>宝可梦对对碰 - PWA版</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* 使用flex布局确保内容在可视区域内 */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 10px) 
                     env(safe-area-inset-right, 10px) 
                     env(safe-area-inset-bottom, 10px) 
                     env(safe-area-inset-left, 10px);
        }

        /* 确保所有内容都在容器内 */
        #game-container > * {
            flex-shrink: 0;
        }

        /* 标题样式 */
        .game-title {
            text-align: center;
            color: #FFD700;
            font-size: min(26px, 7vw);
            font-weight: bold;
            padding: min(15px, 3vh) 0 min(10px, 2vh) 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        /* 信息栏样式 */
        .info-bar {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: 0 auto min(15px, 2vh) auto;
            padding: min(15px, 2vh) min(20px, 4vw);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 九宫格容器 */
        .grid-wrapper {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 5px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }

        /* 按钮容器 */
        .button-bar {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: min(15px, 2vh) auto;
            display: flex;
            justify-content: center;
            gap: min(20px, 4vw);
            padding: 0 min(10px, 2vw);
            box-sizing: border-box;
        }

        /* 按钮样式 */
        .game-button {
            flex: 1;
            max-width: min(160px, 40vw);
            padding: min(12px, 2vh) min(20px, 4vw);
            font-size: min(16px, 4vw);
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
            min-height: min(44px, 8vh);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* 消息板容器 */
        .log-container {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: 0 auto;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .log-title {
            color: #FFD700;
            font-size: min(16px, 4vw);
            font-weight: bold;
            margin-bottom: 5px;
            padding-left: 5px;
        }

        .message-board {
            width: 100%;
            height: min(140px, 20vh);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <script>
        // 动态调整容器大小
        function adjustContainer() {
            const container = document.getElementById('game-container');
            if (container) {
                // 确保容器填满整个屏幕
                container.style.height = window.innerHeight + 'px';
            }
        }

        // 初始调整
        window.addEventListener('load', adjustContainer);
        // 旋转屏幕时调整
        window.addEventListener('resize', adjustContainer);
        // iOS键盘弹出时调整
        window.addEventListener('orientationchange', adjustContainer);
    </script>
    
    <script type="module" src="main.js"></script>
</body>
</html>
