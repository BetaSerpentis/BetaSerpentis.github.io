<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：使用viewport-fit=cover适配刘海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA 配置 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="宝可梦对对碰">
    
    <title>宝可梦对对碰 - PWA版</title>

    <!-- iOS 主屏幕图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="./icons/icon-120.png">

    <!-- iOS 启动屏（可选，让启动体验更好） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 强制所有元素继承背景色 */
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) fixed;
        }
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: transparent;
        }

        /* 底部安全区域颜色填充（仅纯色，避免额外 GPU 合成层） */
        body::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-bottom, 0);
            background: #764ba2;
            z-index: -1;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            /* 使用安全区域padding，但确保背景色覆盖 */
            padding: env(safe-area-inset-top, 10px) 
                     env(safe-area-inset-right, 10px) 
                     max(env(safe-area-inset-bottom, 20px), 20px) 
                     env(safe-area-inset-left, 10px);
            /* 透明背景，让body的背景显示 */
            background: transparent;
        }

        /* 确保所有内容容器也是透明的 */
        #game-container > * {
            flex-shrink: 0;
            background: transparent;
        }

        /* 标题样式 */
        .game-title {
            text-align: center;
            color: #FFD700;
            font-size: min(26px, 7vw);
            font-weight: bold;
            padding: min(15px, 3vh) 0 min(10px, 2vh) 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
            background: transparent;
        }

        /* 信息栏样式 - 保持半透明 */
        .info-bar {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: 0 auto min(15px, 2vh) auto;
            padding: min(15px, 2vh) min(20px, 4vw);
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 九宫格容器 */
        .grid-wrapper {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        /* 按钮容器 */
        .button-bar {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: min(15px, 2vh) auto min(25px, 4vh) auto;
            display: flex;
            justify-content: center;
            gap: min(20px, 4vw);
            padding: 0 min(10px, 2vw);
            box-sizing: border-box;
            background: transparent;
        }

        /* 按钮样式 */
        .game-button {
            flex: 1;
            max-width: min(160px, 40vw);
            padding: min(12px, 2vh) min(20px, 4vw);
            font-size: min(16px, 4vw);
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
            min-height: min(44px, 8vh);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .game-button:active {
            transform: scale(0.95);
        }

        /* 命定属性按钮容器 */
        .type-bar {
            width: 100%;
            max-width: min(400px, 90vw);
            margin: min(15px, 2vh) auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }
        /* 确保所有容器元素无白色背景 */
        #game-container, div, section, article {
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <script>
        // 动态调整容器大小，确保背景色覆盖
        function adjustContainer() {
            const container = document.getElementById('game-container');
            if (container) {
                // 确保容器填满整个屏幕
                container.style.height = window.innerHeight + 'px';
            }
        }

        // 初始调整
        window.addEventListener('load', adjustContainer);
        // 旋转屏幕时调整
        window.addEventListener('resize', adjustContainer);
        // iOS键盘弹出时调整
        window.addEventListener('orientationchange', adjustContainer);
        
        // 立即执行一次
        adjustContainer();
        
        // 额外处理：监听安全区域变化（iOS特有）
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', adjustContainer);
        }
    </script>
    
    <script type="module" src="main.js"></script>
</body>
</html>
