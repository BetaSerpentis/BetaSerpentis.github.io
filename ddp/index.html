<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝可梦对对碰 - 逻辑测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #FFD700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .game-area {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        .console-output {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            height: 500px;
            overflow-y: auto;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 13px;
            line-height: 1.3;
        }
        .console-line {
            margin: 5px 0;
            line-height: 1.4;
        }
        .console-line.info {
            color: #4FC3F7;
        }
        .console-line.success {
            color: #81C784;
        }
        .console-line.warning {
            color: #FFB74D;
        }
        .console-line.error {
            color: #E57373;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        button {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .grid-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .grid-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 5px;
            text-align: center;
            overflow: hidden;
        }

        .grid-cell div {
            margin: 1px 0;
        }
        .stats {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
        }
        .stats h3 {
            margin-top: 0;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>宝可梦对对碰 - 逻辑测试</h1>
        
        <div class="game-area">
            <div>
                <div id="console" class="console-output"></div>
                <div class="grid-display" id="gridDisplay">
                    <!-- 九宫格将通过JS动态生成 -->
                </div>
            </div>
            
            <div class="controls">
                <button id="summonBtn">决定就是你了！</button>
                <button id="autoBtn">批量投放所有球</button>
                <button id="resetBtn">重新开始</button>
                
                <div class="stats">
                    <h3>游戏状态</h3>
                    <div id="statsDisplay">
                        精灵球: <span id="ballCount">9</span><br>
                        累计获得: <span id="totalBalls">0</span><br>
                        传说出场: <span id="legendaryCount">0</span><br>
                        幻之出场: <span id="mythicalCount">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import PokemonData from './core/PokemonData.js';
        import GameBoard from './core/GameBoard.js';

        class WebConsoleGame {
            constructor() {
                this.pokemonData = new PokemonData();
                this.gameBoard = null;
                this.consoleElement = document.getElementById('console');
                this.gridElement = document.getElementById('gridDisplay');
                this.isAutoRunning = false;
                
                this.init();
            }

            async init() {
                this.log('=== 宝可梦对对碰 - 逻辑测试版 ===', 'info');
                this.log('正在加载宝可梦数据...', 'info');
                
                try {
                    const loaded = await this.pokemonData.loadData('./data/pokemon_config.json');
                    if (!loaded) {
                        this.log('无法加载宝可梦数据，请检查控制台错误信息', 'error');
                        return;
                    }
                    
                    const allTypes = this.pokemonData.getAllTypes();
                    const chosenType = allTypes[0];
                    this.log(`选择属性: ${chosenType}`, 'success');
                    
                    this.gameBoard = new GameBoard(this.pokemonData, chosenType, 9);
                    
                    // 初始化九宫格显示
                    this.initGridDisplay();
                    
                    // 绑定按钮事件
                    document.getElementById('summonBtn').addEventListener('click', () => this.summon());
                    document.getElementById('resetBtn').addEventListener('click', () => this.resetGame());
                    
                    // 或者修改现有的自动运行按钮
                    document.getElementById('autoBtn').addEventListener('click', () => this.batchSummon());

                    this.log('游戏准备就绪！点击"决定就是你了！"开始游戏', 'success');
                    this.updateStats();
                    
                } catch (error) {
                    this.log(`初始化失败: ${error.message}`, 'error');
                    console.error(error);
                }
            }

            log(message, type = 'info') {
                const line = document.createElement('div');
                line.className = `console-line ${type}`;
                line.textContent = `> ${message}`;
                this.consoleElement.appendChild(line);
                this.consoleElement.scrollTop = this.consoleElement.scrollHeight;
            }

            initGridDisplay() {
                this.gridElement.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.id = `cell-${i}`;
                    cell.textContent = '空';
                    this.gridElement.appendChild(cell);
                }
            }

            // 在 WebConsoleGame 类中，更新 updateGridDisplay 方法：
            updateGridDisplay() {
                if (!this.gameBoard) return;
                
                for (let i = 0; i < 9; i++) {
                    const cell = document.getElementById(`cell-${i}`);
                    const pokemon = this.gameBoard.grid[i];
                    
                    if (pokemon) {
                        const name = pokemon.data.name;
                        const typeSymbol = pokemon.currentTypes[0]?.charAt(0) || '?';
                        const shinySymbol = pokemon.isShiny ? '★' : '';
                        const transformerSymbol = pokemon.data.isTransformer ? '变' : '';
                        const legendarySymbol = pokemon.data.isLegendary ? '传' : '';
                        const mythicalSymbol = pokemon.data.isMythical ? '幻' : '';
                        
                        // 缩短名字显示（最多2个中文字符）
                        const shortName = name.length > 2 ? name.substring(0, 2) : name;
                        
                        cell.innerHTML = `
                            <div style="font-size: 12px; font-weight: bold;">${shortName}</div>
                            <div style="font-size: 10px; opacity: 0.8;">${pokemon.currentTypes.join('+')}</div>
                            <div style="font-size: 14px; color: gold;">${shinySymbol}</div>
                            <div style="font-size: 10px;">
                                ${transformerSymbol}${legendarySymbol}${mythicalSymbol}
                            </div>
                        `;
                        
                        // 根据属性设置背景色
                        const mainType = pokemon.currentTypes[0];
                        const color = this.getTypeColor(mainType);
                        cell.style.background = color;
                        cell.style.color = 'white';
                        cell.style.textShadow = '1px 1px 2px rgba(0,0,0,0.5)';
                    } else {
                        cell.innerHTML = '空';
                        cell.style.background = 'rgba(255, 255, 255, 0.1)';
                        cell.style.color = 'rgba(255, 255, 255, 0.5)';
                    }
                }
            }

            // 增强属性颜色显示
            getTypeColor(type) {
                const colors = this.pokemonData?.typeColors || {};
                const defaultColors = {
                    "草": "#78C850",
                    "火": "#F08030", 
                    "水": "#6890F0",
                    "斗": "#C03028",
                    "超": "#F85888",
                    "恶": "#705848",
                    "雷": "#F8D030",
                    "钢": "#B8B8D0",
                    "龙": "#7038F8",
                    "无": "#A8A878"
                };
                
                const color = colors[type] || defaultColors[type] || 'rgba(255, 255, 255, 0.1)';
                
                // 创建渐变效果
                return `linear-gradient(135deg, ${color}, ${this.darkenColor(color, 20)})`;
            }

            // 辅助方法：加深颜色
            darkenColor(color, percent) {
                // 简化实现，实际项目中可以使用完整的颜色处理
                return color;
            }

            updateStats() {
                if (!this.gameBoard) return;
                
                document.getElementById('ballCount').textContent = this.gameBoard.ballsRemaining;
                document.getElementById('totalBalls').textContent = this.gameBoard.totalBallsAdded;
                document.getElementById('legendaryCount').textContent = this.gameBoard.summonedLegendaryIds.size;
                document.getElementById('mythicalCount').textContent = this.gameBoard.summonedMythicalIds.size;
            }

            // 在 WebConsoleGame 类的 summon 方法中添加：
            async summon() {
                if (this.isAutoRunning) return;
                
                if (!this.gameBoard) {
                    this.log('游戏未初始化', 'error');
                    return;
                }
                
                this.log('--- 召唤开始 ---', 'info');
                
                const result = this.gameBoard.summonPokemon();
                this.updateGridDisplay();
                this.updateStats();
                
                // 显示当前场地状态
                this.displayGridState();
                
                // 检查游戏是否结束
                if (this.gameBoard.checkGameEnd()) {
                    this.log('=== 游戏结束 ===', 'warning');
                    this.showFinalStats();
                }
                
                this.log('--- 召唤结束 ---', 'info');
                return result;
            }

            // 新增方法：显示场地状态
            displayGridState() {
                if (!this.gameBoard) return;
                
                let gridText = '场地状态: ';
                for (let i = 0; i < 9; i++) {
                    const pokemon = this.gameBoard.grid[i];
                    if (pokemon) {
                        gridText += `${pokemon.data.name.substring(0, 2)} `;
                    } else {
                        gridText += '空 ';
                    }
                }
                this.log(gridText, 'info');
            }

            // 在 WebConsoleGame 类中修改 autoRun 方法：
            async autoRun(times) {
                if (this.isAutoRunning) return;
                
                this.isAutoRunning = true;
                this.log(`开始自动运行 ${times} 次召唤...`, 'info');
                
                for (let i = 0; i < times; i++) {
                    if (this.gameBoard.ballsRemaining <= 0) {
                        this.log('精灵球耗尽，自动停止', 'warning');
                        break;
                    }
                    
                    this.log(`--- 第 ${i+1} 次召唤 ---`, 'info');
                    await this.summon();
                    
                    // 显示当前状态
                    this.displayGridState();
                    
                    await this.delay(500); // 增加延迟以便观察
                }
                
                this.isAutoRunning = false;
                this.log('自动运行结束', 'info');
                this.showGameStats();
            }

            async batchSummon() {
                if (this.isAutoRunning) return;
                
                this.isAutoRunning = true;
                this.log('=== 批量投放开始 ===', 'info');
                
                try {
                    const result = await this.gameBoard.summonAllBalls();
                    
                    if (result) {
                        this.log(`批量投放完成，召唤了 ${result.length} 只宝可梦`, 'success');
                        this.updateGridDisplay();
                        this.updateStats();
                        this.displayGridState();
                    }
                } catch (error) {
                    this.log(`批量投放出错: ${error.message}`, 'error');
                }
                
                this.isAutoRunning = false;
                this.log('=== 批量投放结束 ===', 'info');
            }

            // 新增显示游戏状态的方法
            displayGridState() {
                if (!this.gameBoard) return;
                
                // 显示详细的场地信息
                let gridInfo = '场地: ';
                for (let i = 0; i < 9; i++) {
                    const pokemon = this.gameBoard.grid[i];
                    if (pokemon) {
                        const symbols = [];
                        if (pokemon.isShiny) symbols.push('★');
                        if (pokemon.data.isTransformer) symbols.push('变');
                        if (pokemon.data.isLegendary) symbols.push('传');
                        if (pokemon.data.isMythical) symbols.push('幻');
                        
                        gridInfo += `${pokemon.data.name}${symbols.join('')}|`;
                    } else {
                        gridInfo += '空|';
                    }
                }
                this.log(gridInfo, 'info');
                this.log(`精灵球: ${this.gameBoard.ballsRemaining}`, 'info');
            }

            showGameStats() {
                if (!this.gameBoard) return;
                
                const stats = {
                    ballsRemaining: this.gameBoard.ballsRemaining,
                    totalBallsAdded: this.gameBoard.totalBallsAdded,
                    legendaryCount: this.gameBoard.summonedLegendaryIds.size,
                    mythicalCount: this.gameBoard.summonedMythicalIds.size,
                    emptySlots: this.gameBoard.grid.filter(cell => cell === null).length
                };
                
                this.log('=== 当前统计 ===', 'info');
                this.log(`剩余精灵球: ${stats.ballsRemaining}`, 'info');
                this.log(`累计获得球: ${stats.totalBallsAdded}`, 'info');
                this.log(`传说宝可梦: ${stats.legendaryCount}`, 'info');
                this.log(`幻之宝可梦: ${stats.mythicalCount}`, 'info');
                this.log(`空位数量: ${stats.emptySlots}`, 'info');
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            resetGame() {
                if (this.isAutoRunning) {
                    this.isAutoRunning = false;
                }
                
                const allTypes = this.pokemonData.getAllTypes();
                const chosenType = allTypes[0];
                this.gameBoard = new GameBoard(this.pokemonData, chosenType, 9);
                
                this.consoleElement.innerHTML = '';
                this.log('游戏已重置', 'success');
                this.updateGridDisplay();
                this.updateStats();
            }

            showFinalStats() {
                if (!this.gameBoard) return;
                
                const stats = this.gameBoard.getGameStats();
                this.log('=== 最终统计 ===', 'info');
                this.log(`总召唤次数: ${stats.totalSummons}`, 'info');
                this.log(`累计获得精灵球: ${stats.totalRewards}`, 'info');
                this.log(`传说宝可梦出场: ${stats.legendarySummoned}`, 'info');
                this.log(`幻之宝可梦出场: ${stats.mythicalSummoned}`, 'info');
            }
        }

        // 启动游戏
        const game = new WebConsoleGame();
    </script>
</body>
</html>
