<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#C62828">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="周家财务">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>周家财务</title>
</head>
<body>
  <div id="app">
    <!-- 顶部安全区域占位 -->
    <div id="safe-top"></div>

    <!-- 汇总条 -->
    <div id="summary-bar">
      <div class="summary-item">
        <div class="summary-label">全部 收入</div>
        <div class="summary-amount">¥0</div>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-item">
        <div class="summary-label">全部 支出</div>
        <div class="summary-amount">¥0</div>
      </div>
    </div>

    <!-- 记一笔按钮 -->
    <div id="fab-add">
      <button class="fab-btn">✏️ 记一笔</button>
    </div>

    <!-- 账单列表 -->
    <div id="record-list"></div>

    <!-- 分步记帐弹窗 -->
    <div id="entry-modal" class="modal-overlay hidden">
      <div class="step-modal">
        <div class="step-indicator" id="step-indicator"></div>
        <div class="step-body" id="step-body"></div>
        <div class="step-nav" id="step-nav"></div>
      </div>
    </div>

    <!-- 筛选弹窗 -->
    <div id="filter-modal" class="modal-overlay hidden">
      <div class="filter-modal-card">
        <div class="filter-modal-header">
          <span class="filter-modal-title">🔍 筛选条件</span>
          <button class="filter-close-btn" id="filter-close">✕</button>
        </div>
        <div class="filter-modal-body" id="filter-body"></div>
      </div>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirm-dialog" class="modal-overlay hidden">
      <div class="modal-card">
        <p class="modal-message" id="confirm-message"></p>
        <div class="modal-actions">
          <button class="modal-btn-cancel" id="confirm-cancel">取消</button>
          <button class="modal-btn-confirm" id="confirm-ok">确认</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="success-toast" id="success-toast"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
